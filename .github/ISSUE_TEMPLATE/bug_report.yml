name: Bug report
description: Laporkan perilaku yang salah
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi
      description: Jelaskan perilaku yang salah dan yang diharapkan.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: |
        1. Buka ...
        2. Klik ...
        3. Lihat ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Lingkungan
      description: OS, browser, dan versi Node kalau relevan.
      placeholder: Windows 11, Chrome 145, Node 24
  - type: textarea
    id: extra
    attributes:
      label: Konteks tambahan
      description: Screenshot, log konsol, atau file desain JSON.
